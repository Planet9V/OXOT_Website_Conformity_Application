services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oxot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxot}
      POSTGRES_DB: oxot
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxot -d oxot"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: pushes the Drizzle schema into the local database.
  migrate:
    build:
      context: .
      target: build
    platform: linux/amd64
    command: ["pnpm", "--filter", "@workspace/db", "run", "push-force"]
    environment:
      DATABASE_URL: postgres://oxot:${POSTGRES_PASSWORD:-oxot}@db:5432/oxot
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot: seeds the reference layer (regulations, CRA requirements,
  # classes, routes) and the example CRA workspace (product, assessment,
  # SBOM analysis, cra-default flow + run). Both scripts are idempotent, so
  # re-running the stack is safe. The API also self-heals missing baseline
  # data on boot, but this makes seeding an explicit deployment step.
  seed:
    build:
      context: .
      target: build
    platform: linux/amd64
    command:
      - sh
      - -c
      - >-
        pnpm --filter @workspace/api-server run seed:site &&
        pnpm --filter @workspace/api-server run seed:conformity &&
        pnpm --filter @workspace/api-server run seed:demo
    environment:
      DATABASE_URL: postgres://oxot:${POSTGRES_PASSWORD:-oxot}@db:5432/oxot
      # Optional — lets the seed generate assistant embeddings:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Skips pino's dev-only pino-pretty transport. That transport spawns a
      # worker thread at a package-relative path, which esbuild's bundling
      # breaks (dist/lib/worker.js does not exist) — MODULE_NOT_FOUND crash.
      # These are one-shot batch scripts with no interactive terminal to
      # pretty-print for, so plain logs are correct here regardless.
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # On-demand (profile "tools"): exports the LIVE site content (pages, nav,
  # settings) from the database back into the versioned snapshot at
  # artifacts/api-server/src/content/snapshot/site-content.json, so admin CMS
  # edits become part of the seed. Run after editing content, then commit:
  #   docker compose run --rm content-export
  content-export:
    build:
      context: .
      target: build
    platform: linux/amd64
    profiles: ["tools"]
    command: ["pnpm", "--filter", "@workspace/api-server", "run", "content:export"]
    environment:
      DATABASE_URL: postgres://oxot:${POSTGRES_PASSWORD:-oxot}@db:5432/oxot
      # See the seed service's NODE_ENV comment: avoids pino-pretty's broken
      # bundled worker-thread path.
      NODE_ENV: production
    volumes:
      - ./artifacts/api-server/src/content:/app/artifacts/api-server/src/content
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
      args:
        CACHEBUST: ${CACHEBUST:-1}
    platform: linux/amd64
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://oxot:${POSTGRES_PASSWORD:-oxot}@db:5432/oxot
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      # OpenRouter API Key & Base URL (Highest Priority)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_REASONING_MODEL: ${OPENROUTER_REASONING_MODEL:-deepseek/deepseek-r1}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-qwen/qwen-image-3-pro}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-qwen/qwen3-embedding-8b}
      OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL:-qwen/qwen-audio-3.0-tts-flash}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:-}
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        CACHEBUST: ${CACHEBUST:-1}
    platform: linux/amd64
    ports:
      - "8088:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
