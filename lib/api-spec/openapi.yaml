    BomNotification:
      type: object
      description: >-
        A tracked CRA Art 13(6) upstream notification: whether the maintainer of
        a third-party component was told about a vulnerability found in it.
        `componentKey` is the stable identity (purl, else name@version) the
        record is keyed by.
      properties:
        id: { type: integer }
        assessmentId: { type: integer }
        componentKey: { type: string }
        componentName: { type: string }
        componentVersion: { type: string }
        purl: { type: string }
        vulnerabilityId: { type: string }
        status:
          type: string
          enum: [not_required, pending, notified, acknowledged]
        maintainerContact: { type: string }
        method: { type: string }
        notifiedAt: { type: string, nullable: true }
        dueAt: { type: string, nullable: true }
        acknowledgedAt: { type: string, nullable: true }
        notes: { type: string }
        recordedBy: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - assessmentId
        - componentKey
        - componentName
        - componentVersion
        - purl
        - vulnerabilityId
        - status
        - maintainerContact
        - method
        - notifiedAt
        - dueAt
        - acknowledgedAt
        - notes
        - recordedBy
        - createdAt
        - updatedAt
    BomNotificationGap:
      type: object
      description: >-
        A vulnerability finding whose Art 13(6) upstream-notification duty is
        unresolved — either untracked (`trackedStatus` empty) or tracked but
        still `pending`. Carries everything needed to open the tracking dialog
        directly.
      properties:
        findingId: { type: integer }
        trackedStatus:
          type: string
          description: Empty when untracked; `pending` when tracked but not yet notified.
        bomId: { type: integer }
        bomName: { type: string }
        componentKey: { type: string }
        componentName: { type: string }
        componentVersion: { type: string }
        purl: { type: string }
        vulnerabilityId: { type: string }
        severity: { type: string }
      required:
        - findingId
        - trackedStatus
        - bomId
        - bomName
        - componentKey
        - componentName
        - componentVersion
        - purl
        - vulnerabilityId
        - severity
    BomNotificationInput:
      type: object
      description: >-
        Identify the component by name/version and (preferably) purl; the server
        derives the canonical componentKey. Upserts on
        (assessment, componentKey, vulnerabilityId).
      properties:
        componentName: { type: string }
        componentVersion: { type: string }
        purl: { type: string }
        vulnerabilityId: { type: string, minLength: 1 }
        status:
          type: string
          enum: [not_required, pending, notified, acknowledged]
        maintainerContact: { type: string }
        method: { type: string }
        notifiedAt: { type: string, nullable: true }
        dueAt: { type: string, nullable: true }
        notes: { type: string }
      required:
