  /conformity/advisories/{id}/impacted-users:
    get:
      operationId: getAdvisoryImpactedUsers
      tags: [conformity]
      summary: Which registered users an advisory impacts (Art. 14(8))
      description: >
        The advisory's affected-versions field is free text, so the only
        honest derivation is an exact match on the RECORDED version: users
        whose recorded version appears verbatim are "impacted"; users with
        NO recorded version cannot be ruled out; everyone else needs manual
        verification. The response carries that rule so no caller can
        present the split as more certain than it is.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The tri-state split with its rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisoryImpactedUsers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
