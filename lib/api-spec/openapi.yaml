components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The session lacks the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    LocalePath:
      name: locale
      in: path
      required: true
      description: Language for the returned content.
      schema:
        $ref: "#/components/schemas/Locale"
    IdPath:
      name: id
      in: path
      required: true
      description: Numeric resource identifier.
      schema:
        type: integer
    BomIdPath:
      name: bomId
      in: path
      required: true
      description: Numeric BOM identifier.
      schema:
        type: integer
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      description: Numeric upstream-notification identifier.
      schema:
        type: integer
    FlowIdPath:
      name: flowId
      in: path
      required: true
      description: Numeric flow definition identifier.
      schema:
        type: integer
    RunIdPath:
      name: runId
      in: path
      required: true
      description: Numeric flow run identifier.
      schema:
        type: integer
    StepKeyPath:
      name: stepKey
      in: path
      required: true
      description: Flow step id (key) within the run's step states.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KeyDate:
      type: object
      properties:
        regulationKey:
          type: string
        date:
          type: string
        label:
          type: string
      required:
        - date
        - label
    RegulationStat:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        shortName:
          type: string
        requirementCount:
          type: integer
      required:
        - key
        - name
        - shortName
        - requirementCount
    ConformitySummary:
      type: object
      properties:
        regulationCount:
          type: integer
        requirementCount:
          type: integer
        themeCount:
          type: integer
        mappingCount:
          type: integer
        regulations:
          type: array
          items:
            $ref: "#/components/schemas/RegulationStat"
        keyDates:
          type: array
          items:
            $ref: "#/components/schemas/KeyDate"
      required:
        - regulationCount
        - requirementCount
        - themeCount
        - mappingCount
        - regulations
        - keyDates
    ConformityPortfolio:
      type: object
      description: Operational rollup across every product assessment.
      properties:
        generatedAt:
          type: string
          description: ISO timestamp the rollup was computed.
        totals:
          $ref: "#/components/schemas/PortfolioTotals"
        risk:
          $ref: "#/components/schemas/PortfolioRisk"
        evidence:
          $ref: "#/components/schemas/PortfolioEvidence"
        grades:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioGradeBucket"
        deadlines:
          type: array
          description: Every open statutory deadline across the portfolio, soonest first.
          items:
            $ref: "#/components/schemas/PortfolioDeadline"
        products:
          type: array
          description: Per-assessment triage rows, most urgent first.
          items:
            $ref: "#/components/schemas/PortfolioProduct"
      required:
        - generatedAt
        - totals
        - risk
        - evidence
        - grades
        - deadlines
        - products
    PortfolioTotals:
      type: object
      description: Assessment counts. The four readiness buckets are mutually exclusive and sum to assessments.
      properties:
        products:
          type: integer
        assessments:
          type: integer
        notStarted:
          type: integer
        inProgress:
          type: integer
        blocked:
          type: integer
        readyForReview:
          type: integer
      required:
        - products
        - assessments
        - notStarted
        - inProgress
        - blocked
        - readyForReview
    PortfolioRisk:
      type: object
      description: Portfolio-wide urgency and risk counters.
      properties:
        openBlockers:
          type: integer
          description: Requirements marked not met (cap the grade).
        highRiskGaps:
          type: integer
          description: High or critical risk requirements not yet resolved.
        openIncidents:
          type: integer
        overdueDeadlines:
          type: integer
        dueSoonDeadlines:
          type: integer
          description: Open statutory deadlines due within 14 days (not yet overdue).
        silencedDeadlines:
          type: integer
          description: >-
            Overdue deadlines whose breach reminder emails are exhausted
            (alerting has gone silent).
      required:
        - openBlockers
        - highRiskGaps
        - openIncidents
        - overdueDeadlines
        - dueSoonDeadlines
        - silencedDeadlines
    PortfolioEvidence:
      type: object
      description: >-
        Honest coverage ratios. Percentages are null when the denominator is
        zero (nothing to measure yet) rather than a misleading 0 or 100.
      properties:
        requirementCoverage:
          type: ["number", "null"]
          description: Resolved (met or not applicable) over total requirements, as a percentage.
        evidenceCoverage:
          type: ["number", "null"]
          description: Applicable requirements with at least one evidence item, over all applicable requirements, as a percentage.
        documentationCoverage:
          type: ["number", "null"]
          description: Complete artifact sections over total artifact sections, as a percentage.
        totalRequirements:
          type: integer
        resolvedRequirements:
          type: integer
        applicableRequirements:
          type: integer
        evidencedRequirements:
          type: integer
        totalSections:
          type: integer
        completeSections:
          type: integer
      required:
        - requirementCoverage
        - evidenceCoverage
        - documentationCoverage
        - totalRequirements
        - resolvedRequirements
        - applicableRequirements
        - evidencedRequirements
        - totalSections
        - completeSections
    PortfolioGradeBucket:
      type: object
      properties:
        grade:
          type: string
          description: One of A, B, C, D, F, or "ungraded".
        count:
          type: integer
      required:
        - grade
        - count
    PortfolioDeadline:
      type: object
      properties:
        assessmentId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        regulationKey:
          type: string
        incidentTitle:
          type: string
        incidentKind:
          type: string
          description: CRA Art 14 track — exploited_vulnerability or severe_incident.
        severity:
          type: string
        kind:
          type: string
          description: One of early_warning, notification, final_report.
        dueAt:
          type: string
        overdue:
          type: boolean
        alertsSilenced:
          type: boolean
          description: >-
