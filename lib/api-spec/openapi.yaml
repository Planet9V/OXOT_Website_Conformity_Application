        `notified`, `acknowledged` and `not_required` resolve the duty. Matched
        by the stable component identity key + vulnerability id, the same rule
        the inline finding chips use. Read-only — derived from existing
        findings and notification records.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Untracked vulnerability findings, grouped implicitly by BOM order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BomNotificationGap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
