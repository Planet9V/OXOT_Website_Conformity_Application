openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: site
    description: Public site content
  - name: pages
    description: Public page content
  - name: admin
    description: Admin authentication
  - name: chat
    description: Visitor AI assistant chat and lead capture
  - name: leads
    description: Admin lead management and content indexing
  - name: storage
    description: Object storage upload and serving
  - name: cms
    description: Admin page CMS with draft/publish, versioning, and navigation
  - name: media
    description: Admin media library and homepage carousel
  - name: settings
    description: Admin LLM/model configuration
  - name: wizard
    description: Admin landing-page wizard, templates, and translation
  - name: growth
    description: Affiliate links, SEO metadata, visitor analytics, and AI recommendations
  - name: newsletter
    description: Newsletter subscription (GDPR double opt-in), campaigns, and sending
  - name: conformity
    description: Multi-regulation conformity knowledge & mapping engine (CRA, AI Act, Machinery, IEC 62443)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /site/{locale}/settings:
    get:
      operationId: getSiteSettings
      tags: [site]
      summary: Get site settings
      description: Returns branding, contact, and social settings for the requested locale.
      parameters:
        - $ref: "#/components/parameters/LocalePath"
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /site/{locale}/navigation:
    get:
      operationId: getNavigation
      tags: [site]
      summary: Get navigation menu
      description: Returns ordered navigation items for the requested locale. Filter by placement on the client.
      parameters:
        - $ref: "#/components/parameters/LocalePath"
      responses:
        "200":
          description: Navigation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NavItem"
        "400":
          $ref: "#/components/responses/BadRequest"
  /site/{locale}/pages:
    get:
      operationId: listPages
      tags: [pages]
      summary: List published pages
      description: Returns published page summaries for the requested locale.
      parameters:
        - $ref: "#/components/parameters/LocalePath"
      responses:
        "200":
          description: Page summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
  /site/{locale}/pages/{slug}:
    get:
      operationId: getPage
      tags: [pages]
      summary: Get a page by slug
      description: Returns a published page with its ordered sections for the requested locale.
      parameters:
        - $ref: "#/components/parameters/LocalePath"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      description: Authenticates with the single admin credential and sets a session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      description: Clears the admin session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get current admin session
      description: Returns whether the current request is authenticated as admin.
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/team:
    get:
      operationId: listTeamMembers
      tags: [admin]
      summary: List named team members
      description: Returns every named assessor account, active and deactivated. Requires an admin session.
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTeamMember
      tags: [admin]
      summary: Create a named team member
      description: >-
        Creates a named assessor (display name + username/password) who signs in
        individually and works the conformity workbench under their own identity.
        Requires an admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamMemberInput"
      responses:
        "200":
          description: Created team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [admin]
      summary: Update a team member (rename, activate/deactivate, reset password)
      description: >-
        Deactivating a member (active=false) blocks sign-in AND invalidates their
        existing sessions immediately. Accounts are never deleted so the activity
        ledger's actor history stays resolvable. Requires an admin session.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberInput"
      responses:
        "200":
          description: Updated team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /conformity/me:
    get:
      operationId: getMyProfile
      tags: [conformity]
      summary: Get the signed-in account's profile
      description: >-
        Profile of whoever is signed in. Member sessions include first-login
        onboarding state and their member-since date; admin/demo sessions are
        env-configured accounts and always read as onboarded.
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMyProfile
      tags: [conformity]
      summary: Update the signed-in member's own profile
      description: >-
        Named assessors may change how their name reads in the audit trail and
        assignments. Admin and demo accounts are env-configured and cannot be
        edited here; the demo workspace is read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a named member account (admin/demo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conformity/me/password:
    post:
      operationId: changeMyPassword
      tags: [conformity]
      summary: Change the signed-in member's own password
      description: >-
        Self-service password change for named assessors. Verifies the current
        password before storing a new scrypt hash. Admin and demo credentials
        are env-configured and cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMyPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a named member account (admin/demo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conformity/me/onboarding:
    post:
      operationId: completeMyOnboarding
      tags: [conformity]
      summary: Mark first-login onboarding as completed
      description: >-
        Stamps the signed-in member's onboarding timestamp. Idempotent —
        completing an already-onboarded account is a no-op that returns the
        current profile.
      responses:
        "200":
          description: Profile after completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a named member account (admin/demo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conformity/me/tours:
    post:
      operationId: markMyTourSeen
      tags: [conformity]
      summary: Mark a guided tour as seen for the signed-in member
      description: >-
        Records that the signed-in member has seen a guided tour so it never
        auto-starts again on any device. Idempotent — marking an already-seen
        tour is a no-op that returns the current profile. Admin and demo
        sessions have no account row; they persist tour state per browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkMyTourSeenInput"
      responses:
        "200":
          description: Profile after the tour is recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a named member account (admin/demo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /chat/{locale}/conversations:
    post:
      operationId: createChatConversation
      tags: [chat]
      summary: Start a chat conversation
      description: Creates a new visitor conversation for the requested locale.
      parameters:
        - $ref: "#/components/parameters/LocalePath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationInput"
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
  /chat/conversations/{id}:
    get:
      operationId: getChatConversation
      tags: [chat]
      summary: Get a conversation with its messages
      description: Returns a conversation and its ordered messages for session restore.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /chat/conversations/{id}/messages:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message and stream the grounded reply
      description: >-
        Streams the assistant reply as Server-Sent Events. Each event is a JSON
        object with either a `content` delta or `done: true`. Consumed on the
        client with fetch + ReadableStream, not a generated hook.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: SSE stream of reply deltas
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /chat/conversations/{id}/lead:
    post:
      operationId: captureLead
      tags: [chat]
      summary: Capture a contact lead within a conversation
      description: Stores a contact captured inline during a conversation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureLeadInput"
      responses:
        "200":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List captured leads
      description: Returns captured leads, newest first. Requires an admin session.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead with its full transcript
      description: Returns a lead and the full conversation transcript. Requires an admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLeadStatus
      tags: [leads]
      summary: Update a lead's status
      description: Updates the status of a captured lead. Requires an admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadStatusInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/content/index-status:
    get:
      operationId: getContentIndexStatus
      tags: [content]
      summary: Get the assistant content index status
      description: Returns chunk count, last refresh time, and whether a rebuild is running. Requires an admin session.
      responses:
        "200":
          description: Index status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/content/reindex:
    post:
      operationId: reindexContent
      tags: [content]
      summary: Rebuild the assistant content index
      description: >-
        Triggers a full rebuild of the assistant's knowledge index from
        published content. The rebuild runs in the background; the returned
        status reflects that a run is in progress. Requires an admin session.
      responses:
        "200":
          description: Index status after scheduling the rebuild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to the newsletter (starts double opt-in)
      description: >-
        Records a pending subscription and sends a confirmation email. Always
        returns a generic success to avoid disclosing whether an address is
        already subscribed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeInput"
      responses:
        "200":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /newsletter/confirm:
    post:
      operationId: confirmNewsletter
      tags: [newsletter]
      summary: Confirm a newsletter subscription (double opt-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSubscriptionInput"
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /newsletter/unsubscribe:
    post:
      operationId: unsubscribeNewsletter
      tags: [newsletter]
      summary: Unsubscribe / opt out of the newsletter (one click)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeInput"
      responses:
        "200":
          description: Unsubscribe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /newsletter/track/open/{sendId}:
    get:
      operationId: trackNewsletterOpen
      tags: [newsletter]
      summary: Newsletter open-tracking pixel
      description: Returns a 1x1 GIF and records the open. Loaded via an <img> tag in the email.
      parameters:
        - name: sendId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tracking pixel
          content:
            image/gif:
              schema:
                type: string
                format: binary
  /admin/newsletter/subscribers:
    get:
      operationId: listNewsletterSubscribers
      tags: [newsletter]
      summary: List newsletter subscribers
      description: Returns subscribers, newest first. Requires an admin session.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsletterSubscriber"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/newsletter/subscribers/{id}:
    delete:
      operationId: deleteNewsletterSubscriber
      tags: [newsletter]
      summary: Delete a subscriber (GDPR erasure)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/newsletter/mail-status:
    get:
      operationId: getNewsletterMailStatus
      tags: [newsletter]
      summary: Whether an email provider is connected for sending
      responses:
        "200":
          description: Mail status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/newsletters:
    get:
      operationId: listNewsletters
      tags: [newsletter]
      summary: List newsletter campaigns
      responses:
        "200":
          description: Newsletters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Newsletter"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNewsletter
      tags: [newsletter]
      summary: Create a newsletter draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "200":
          description: Created newsletter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Newsletter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/newsletters/generate:
    post:
      operationId: generateNewsletter
      tags: [newsletter]
      summary: Generate a newsletter draft with AI
      description: Drafts a newsletter about a topic, grounded in OXOT's brand and recent published content. Returns content for review; does not persist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateNewsletterInput"
      responses:
        "200":
          description: Generated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedNewsletter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/newsletters/{id}:
    get:
      operationId: getNewsletter
      tags: [newsletter]
      summary: Get a newsletter campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Newsletter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Newsletter"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateNewsletter
      tags: [newsletter]
      summary: Update a newsletter draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "200":
          description: Updated newsletter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Newsletter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteNewsletter
      tags: [newsletter]
      summary: Delete a newsletter campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/newsletters/{id}/schedule:
    post:
      operationId: scheduleNewsletter
      tags: [newsletter]
      summary: Schedule a newsletter to send at a future time
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleNewsletterInput"
      responses:
        "200":
          description: Scheduled newsletter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Newsletter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/newsletters/{id}/unschedule:
    post:
      operationId: unscheduleNewsletter
