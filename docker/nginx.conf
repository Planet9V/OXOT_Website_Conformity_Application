# Mirrors Replit's production path routing:
#   /                      -> OXOT public site (SPA)
#   /conformity/           -> OXOT Conformity workbench (SPA)
#   /conformity-briefing/  -> briefing slides (SPA)
#   /api/                  -> API server
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Relative redirects: the container listens on 80 but is published on a
    # different host port, so absolute redirects would drop the port.
    absolute_redirect off;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The conformity assistant streams SSE — don't buffer API responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Source-library documents: render text formats inline in the browser
    # instead of forcing a download; PDFs open in the built-in viewer.
    location /conformity/sources/ {
        alias /usr/share/nginx/html/conformity/sources/;
        charset utf-8;
        types { text/plain md txt; application/pdf pdf; }
        default_type application/octet-stream;
        # SPA routes under /sources (e.g. the in-app document viewer) fall
        # through to the app; only real files are served from this location.
        try_files $uri @conformity_fallback;
    }

    location /conformity/ {
        alias /usr/share/nginx/html/conformity/;
        index index.html;
        # No $uri/ probe: real directories in the build (e.g. sources/) would
        # 301-redirect SPA routes like /conformity/sources to a 403 dir listing.
        try_files $uri @conformity_fallback;
    }

    location @conformity_fallback {
        rewrite ^ /conformity/index.html last;
    }

    location /conformity-briefing/ {
        alias /usr/share/nginx/html/conformity-briefing/;
        index index.html;
        try_files $uri @briefing_fallback;
    }

    location @briefing_fallback {
        rewrite ^ /conformity-briefing/index.html last;
    }

    location / {
        root /usr/share/nginx/html/oxot;
        try_files $uri $uri/ /index.html;
    }
}
