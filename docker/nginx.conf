# Mirrors Replit's production path routing:
#   /                      -> OXOT public site (SPA)
#   /conformity/           -> OXOT Conformity workbench (SPA)
#   /conformity-briefing/  -> briefing slides (SPA)
#   /api/                  -> API server
#
# Crawler dynamic rendering (Phase 30): social unfurlers and search crawlers do
# not run JavaScript, so on public PAGE routes (no real file on disk) they are
# proxied to /api/seo/render, which returns per-page <title>/description/OG/
# JSON-LD. Humans fall through to the SPA shell. This UA list MUST stay in sync
# with api-server BOT_UA_PATTERNS and oxot-web CRAWLER_UA_PATTERNS — the
# botListDrift test guards all three.
map $http_user_agent $oxot_is_crawler {
    default 0;
    ~*(googlebot|bingbot|duckduckbot|yandexbot|baiduspider|applebot|facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|slack-imgproxy|telegrambot|discordbot|pinterest|redditbot|embedly|whatsapp/2|bot|crawler|spider|headlesschrome|puppeteer|playwright|selenium|curl|wget|python-requests|axios|go-http-client|java/) 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Relative redirects: the container listens on 80 but is published on a
    # different host port, so absolute redirects would drop the port.
    absolute_redirect off;

    # Crawler entry points (22.2): the sitemap and robots are generated by the
    # API but must live at the site root where crawlers look for them.
    location = /sitemap.xml {
        proxy_pass http://api:8080/api/seo/sitemap.xml;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://api:8080/api/seo/robots.txt;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The conformity assistant streams SSE — don't buffer API responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Source-library documents: render text formats inline in the browser
    # instead of forcing a download; PDFs open in the built-in viewer.
    # Bare paths without the trailing slash must reach the SPA, not fall
    # through to the public site — 301 to the canonical slashed prefix.
    location = /conformity { return 301 /conformity/; }
    location = /conformity-briefing { return 301 /conformity-briefing/; }

    location /conformity/sources/ {
        alias /usr/share/nginx/html/conformity/sources/;
        charset utf-8;
        types { text/plain md txt; application/pdf pdf; }
        default_type application/octet-stream;
        # SPA routes under /sources (e.g. the in-app document viewer) fall
        # through to the app; only real files are served from this location.
        try_files $uri @conformity_fallback;
    }

    location /conformity/ {
        alias /usr/share/nginx/html/conformity/;
        index index.html;
        # The SPA shell must never be cached, or clients keep a stale index.html
        # that references an old hashed bundle after a deploy (breaks new routes,
        # e.g. a hard-load of /conformity/psirt 404s). Hashed /assets/*.js are
        # content-addressed, so no-cache just triggers a cheap ETag 304 for them.
        add_header Cache-Control "no-cache" always;
        # No $uri/ probe: real directories in the build (e.g. sources/) would
        # 301-redirect SPA routes like /conformity/sources to a 403 dir listing.
        try_files $uri @conformity_fallback;
    }

    location @conformity_fallback {
        rewrite ^ /conformity/index.html last;
    }

    location /conformity-briefing/ {
        alias /usr/share/nginx/html/conformity-briefing/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        try_files $uri @briefing_fallback;
    }

    location @briefing_fallback {
        rewrite ^ /conformity-briefing/index.html last;
    }

    location / {
        root /usr/share/nginx/html/oxot;
        add_header Cache-Control "no-cache" always;
        # Real files (assets, og images) serve directly; page routes fall to the
        # crawler/SPA split below.
        try_files $uri $uri/ @spa_or_crawler;
    }

    # Page route with no file on disk: crawlers get server-rendered per-page
    # meta; humans get the SPA shell. return 418 -> error_page routes crawlers
    # to the render backend (the one safe idiom for a conditional in nginx).
    location @spa_or_crawler {
        root /usr/share/nginx/html/oxot;
        error_page 418 = @crawler_render;
        if ($oxot_is_crawler) { return 418; }
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html last;
    }

    location @crawler_render {
        proxy_pass http://api:8080/api/seo/render?path=$request_uri;
        proxy_set_header Host $host;
    }
}
