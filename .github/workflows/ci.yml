name: CI

# Gates G1-G5 from docs/cra-personas/task_plan.md. The audit that started this
# programme found 36 defects that two passes of manual review had missed, and no
# CI at all — which is why every one of them survived. G4 and G5 exist because
# a typecheck cannot catch a well-typed lie or a wrong article number.

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest

    # The conformity suites are integration tests against a real database.
    # Without one, 26 of 51 files could not even collect, which hid every real
    # assertion inside them. pgvector matches the image docker-compose uses.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oxot
          POSTGRES_PASSWORD: oxot
          POSTGRES_DB: oxot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://oxot:oxot@localhost:5432/oxot
      # Test-only value; must be >= 32 chars and not the 'change-me' placeholder.
      SESSION_SECRET: ci-test-session-secret-not-a-real-secret-000000
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password-for-tests-only
      NODE_ENV: test
      # The conformity suite asserts that the read-only role cannot mutate.
      # That guard is gated on DEMO_READONLY, so without this the guard is
      # inactive and 23 correct assertions fail against a correctly-written
      # application. This is the configuration under test, not a workaround.
      DEMO_READONLY: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installed directly rather than via pnpm/action-setup, whose self-installer
      # reads .npmrc and crashes on this repo's `only-built-dependencies=*` with
      # "onlyBuiltDependencies?.sort is not a function".
      - name: Install pnpm
        run: npm install -g pnpm@10

      - run: pnpm install --frozen-lockfile

      # G1 — typecheck. lib/db must build first: consumers resolve @workspace/db
      # through TypeScript project references and read its emitted declarations,
      # not its source (lessons.md, L15).
      # Build every composite library before typechecking anything that
      # consumes them. Consumers resolve @workspace/* through TypeScript project
      # references and read the EMITTED declarations, not the source, so a lib
      # that has not been built makes every consumer fail with TS6305.
      # --force because a stray tsbuildinfo would otherwise make this a no-op.
      - name: Build workspace libraries
        run: |
          pnpm --filter @workspace/db exec tsc -b --force
          pnpm --filter @workspace/api-zod exec tsc -b --force
          pnpm --filter @workspace/api-client-react exec tsc -b --force

      - name: G1 typecheck
        run: |
          pnpm --filter @workspace/api-server exec tsc --noEmit
          pnpm --filter @workspace/conformity exec tsc --noEmit
          pnpm --filter @workspace/oxot-web exec tsc --noEmit

      # Every gate below runs with `if: always()` so one red gate cannot
      # silently skip the others.
      #
      # G2 — tests. ZERO failures as of 2026-08-16 (task 8.1 closed issue
      # #62): the "31 known failures" were suites frozen on dead contracts,
      # tests using the wrong session role, test files racing each other on
      # the one shared database (now sequential — vitest.config.ts), and two
      # object-storage tests that SKIP with a stated reason where the storage
      # sidecar is absent. Any failing test fails the build.
      # The schema uses pgvector columns. The image ships the extension but does
      # not enable it, so a fresh database has no `vector` type and every push
      # fails with 'type "vector" does not exist' — which drizzle-kit reports
      # without a non-zero exit, so the step passed while creating no tables.
      - name: Provision the test database
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          pnpm --filter @workspace/db run push-force
          # drizzle-kit can report an error and still exit 0, so verify tables exist.
          count=$(psql "$DATABASE_URL" -tAc "select count(*) from information_schema.tables where table_schema='public';")
          echo "public tables created: $count"
          test "$count" -gt 50
          pnpm --filter @workspace/api-server run seed:conformity

      - name: G2 tests
        run: pnpm --filter @workspace/api-server exec vitest run

      # G3 — the local build. Deliberately not the Docker build: Docker installs
      # its own dependencies and masked a broken local build for weeks (L7).
      - name: G3 build
        # Independent of G2: a failing test must not silently disable the build check.
        if: always()
        run: pnpm --filter @workspace/conformity exec vite build

      # G4 — no UI string may assert a legal act was performed, a status
      # verified, or an exemption granted, unless code computed it.
      - name: G4 honesty gate
        if: always()
        # Started at 36 findings; driven to ZERO 2026-08-16 (task 9.5) and zero
        # is now a COVENANT like G8's: any new unearned statutory claim fails
        # the build. Never raise this.
        run: node scripts/check_honesty.mjs --baseline 0

      # G5 — every CRA article citation must resolve against the corpus built
      # from the Official Journal text.
      - name: G5 citation gate
        if: always()
        # Covers application code AND published material (blogs, podcast
        # scripts, FAQs) — a wrong article number misleads a reader wherever it
        # appears. Baseline is the backlog on the day the scan was widened.
        run: node scripts/check_citations.mjs --baseline 0

      - name: G8 UI reach gate
        if: always()
        # A capability no screen calls is invisible to the customer, however
        # green its tests are. Started at 6 orphans; Phase 7 drove it to ZERO
        # (2026-08-16) and zero is now a COVENANT: a new capability lands
        # WITH its surface and its registry entry in scripts/check_ui_reach.mjs
        # in the same commit, or the build fails. Never raise this.
        # (This line previously lagged at 4: a scripted edit without an
        # assert silently no-oped — L48. Local runs used 0 throughout.)
        run: node scripts/check_ui_reach.mjs --baseline 0

      # THE source-of-truth check. One command, deterministic, three states
      # (PASS / FAIL / "----" could-not-verify). This is the only sanctioned way
      # to assert that the CRA text this repo ships is the published text.
      # See docs/cra-personas/CRA_SOURCE_OF_TRUTH.md.
      - name: CRA source of truth
        if: always()
        run: node scripts/verify_cra_corpus.mjs

      # Same check for NIS2. Its B1 reports "----" (could not verify) for
      # corrigenda by design: scraping EUR-Lex for corrigendum links was tested
      # against the CRA's KNOWN corrigendum and failed to find it, so the method
      # cannot prove an absence. It says so rather than passing vacuously.
      - name: NIS2 source of truth
        if: always()
        run: node scripts/verify_nis2_corpus.mjs

      # Belt and braces: the corpus must also be reproducible byte-for-byte, so
      # a hand-edit of craCorpusData.ts cannot survive.
      - name: Corpus is reproducible from the Official Journal source
        if: always()
        run: |
          node scripts/build_cra_corpus_from_eurlex.mjs
          node scripts/sync_cra_corpus_data.mjs
          node scripts/build_nis2_corpus_from_eurlex.mjs
          node scripts/sync_nis2_corpus_data.mjs
          git diff --exit-code -- artifacts/*/src/**/craCorpusData.ts artifacts/conformity/src/data/nis2CorpusData.ts docs/cra_statutory_corpus/ docs/nis2_statutory_corpus/
